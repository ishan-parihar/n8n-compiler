[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-compiler"
version = "1.0.0"
description = "Bidirectional compiler for n8n workflow JSON files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ishan Parihar"}
]
keywords = ["n8n", "workflow", "compiler", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "pydantic>=2.0",
    "watchdog>=3.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
n8nc = "n8n_compiler.cli:cli"

[project.urls]
Homepage = "https://github.com/ishan-parihar/n8n-compiler"
Repository = "https://github.com/ishan-parihar/n8n-compiler"

[tool.setuptools.packages.find]
where = ["."]
include = ["n8n_compiler*"]

[tool.pytest.ini_options]
testpaths = ["n8n_compiler/tests"]
python_files = ["test_*.py"]
